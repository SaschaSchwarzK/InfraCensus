<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InfraCensus</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #101828;
    }
    body { margin: 0; padding: 0; }
    header { background: #0c111d; color: #f9fafb; padding: 1.5rem 2rem; }
    header h1 { margin: 0 0 0.25rem 0; font-size: 1.5rem; }
    header p { margin: 0; color: #d0d5dd; }
    nav a { color: #84c5f4; margin-right: 1rem; text-decoration: none; }
    main { padding: 2rem; max-width: 960px; margin: 0 auto; }
    .card { background: #ffffff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08); margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid #e4e7ec; }
    .meta { color: #667085; font-size: 0.9rem; }
    .tag { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; background: #eef4ff; color: #3b82f6; font-size: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <h1>InfraCensus Control Plane</h1>
    <p>Tenant-scoped access with read-only, read-write, and user admin roles.</p>
    <nav>
      <a href="/">Overview</a>
      <a href="/tenants">Tenants</a>
      <a href="/admin/tenants">Superadmin</a>
      <a href="/admin/audit">Audit Log</a>
    </nav>
    {% if user %}
      <div class="meta" style="margin-top: 0.5rem;">
        Signed in as {{ user.email }}
        <form action="/logout" method="post" style="display: inline;">
          <button type="submit" style="margin-left: 0.75rem;">Logout</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
