environment: dev
api_host: 0.0.0.0
api_port: 8000
database_url: postgresql+psycopg://infracensus:infracensus@localhost:5432/infracensus
db_pool_size: 5
db_max_overflow: 10
db_pool_timeout: 30
db_pool_recycle: 1800
db_pool_pre_ping: true
session_secret: "change-me-in-prod-change-me-in-prod"
auth_mode: local
oidc_scopes: "openid email profile"
oidc_redirect_uri: "http://localhost:8000/oidc/callback"
collector_tokens: ""
api_keys: ""
vault_addr: null
vault_token: null
vault_kv_mount: secret
vault_namespace: null
require_vault: false
collector_rate_limit_per_hour: 1000
collector_quarantine_seconds: 3600
scheduler_max_jobs_per_poll: 5
scheduler_default_capacity: 2
scheduler_job_assignment_ttl_seconds: 1800
scheduler_network_rate_limit_per_minute: 6
scheduler_network_rate_limit_window_seconds: 60
vault_rotation_targets: ""
collector_clock_skew_max_seconds: 300
security_headers_enabled: true
security_csp: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"
security_frame_options: DENY
security_referrer_policy: no-referrer
security_hsts_seconds: 31536000
security_hsts_include_subdomains: true
security_hsts_preload: false
ca_key_path: "./ca/ca.key"
ca_cert_path: "./ca/ca.crt"
ca_cert_valid_days: 3650
collector_cert_valid_days: 365
