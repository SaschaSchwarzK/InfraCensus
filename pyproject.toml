[tool.poetry]
name = "infracensus"
version = "0.1.0"
description = "Network infrastructure discovery and inventory platform"
authors = ["Sascha Schwarz <sascha@providerhoelle.de>"]
readme = "README.md"
packages = [{include = "central"}, {include = "collector"}]

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.central.dependencies]
fastapi = "0.115.0"
uvicorn = "0.30.6"
SQLAlchemy = "2.0.34"
alembic = "1.13.2"
Jinja2 = "3.1.4"
Authlib = "1.3.1"
itsdangerous = "2.2.0"
httpx = "0.27.2"
passlib = "1.7.4"
python-multipart = "0.0.9"
structlog = "^25.5.0"
prometheus-client = "^0.24.1"
redis = "^7.1.0"
cryptography = "^43.0.3"
opentelemetry-api = "^1.26.0"
opentelemetry-sdk = "^1.26.0"
opentelemetry-exporter-otlp-proto-http = "^1.26.0"
PyYAML = "^6.0.1"
pydantic = "^2.8.2"

[tool.poetry.group.collector.dependencies]
httpx = "0.27.2"
opentelemetry-api = "^1.26.0"
opentelemetry-sdk = "^1.26.0"
opentelemetry-exporter-otlp-proto-http = "^1.26.0"
PyYAML = "^6.0.1"
pydantic = "^2.8.2"

[tool.poetry.group.dev.dependencies]
ruff = "0.14.14"
pytest = "9.0.2"
mypy = "1.19.1"
bandit = "1.9.3"

[tool.poetry.scripts]
mypy = "mypy:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # Allow long lines for embedded docs/examples and OpenAPI text
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = ["contract",]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", "docs", "alembic"]
skips = ["B101"]
