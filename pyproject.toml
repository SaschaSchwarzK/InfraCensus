[tool.poetry]
name = "infracensus"
version = "0.1.0"
description = "Network infrastructure discovery and inventory platform"
authors = ["Sascha Schwarz <sascha@providerhoelle.de>"]
readme = "README.md"
packages = [{include = "central"}, {include = "collector"}]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "0.115.0"
uvicorn = "0.30.6"
SQLAlchemy = "2.0.34"
alembic = "1.13.2"
Jinja2 = "3.1.4"
Authlib = "1.3.1"
itsdangerous = "2.2.0"
httpx = "0.27.2"
passlib = "1.7.4"
python-multipart = "0.0.9"

[tool.poetry.group.dev.dependencies]
ruff = "0.6.9"
pytest = "8.3.3"
mypy = "1.11.2"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    # Allow long lines for embedded docs/examples and OpenAPI text
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = ["contract",]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
check_untyped_defs = true
